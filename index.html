<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSmart - Gestion Scolaire Sécurisée</title>
    <!-- Ignorer la requête favicon 404 -->
    <link rel="icon" href="data:,">
    <!-- Config Tailwind pour masquer l'avertissement dev -->
    <script>
        window.tailwind = { config: { suppressDeprecationWarnings: true } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="h-full text-slate-800 flex flex-col antialiased">

    <!-- EN-TÊTE -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 text-white rounded-xl flex items-center justify-center font-bold text-xl shadow-md">E</div>
                <div>
                    <span class="font-bold text-slate-900 tracking-tight text-lg">EduSmart</span>
                    <span class="text-xs bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-full font-medium ml-2">Portail Sécurisé</span>
                </div>
            </div>
            <div id="nav-user-info" class="hidden flex items-center gap-4">
                <div class="text-right">
                    <p id="user-display-name" class="text-sm font-semibold text-slate-800 leading-tight"></p>
                    <p id="user-display-role" class="text-xs font-medium text-indigo-600 uppercase"></p>
                </div>
                <button onclick="logout()" class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition" title="Déconnexion">🚪</button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-6 py-8">

        <!-- Message de chargement initial -->
        <div id="loading-screen" class="text-center py-20 text-slate-400 text-sm">Chargement...</div>

        <!-- SECTION AUTHENTIFICATION -->
        <section id="auth-section" class="max-w-md mx-auto my-8 hidden">
            <div class="bg-white rounded-2xl p-8 border border-slate-200 shadow-xl">
                <div class="text-center mb-6">
                    <h2 class="text-2xl font-bold text-slate-900">Espace Sécurisé</h2>
                    <p class="text-sm text-slate-500 mt-1">Connectez-vous à votre compte</p>
                </div>

                <div class="grid grid-cols-2 p-1 bg-slate-100 rounded-xl mb-6 text-sm font-medium">
                    <button type="button" id="tab-login" onclick="switchAuthTab('login')" class="py-2.5 rounded-lg bg-white shadow-sm text-slate-900 transition">Connexion</button>
                    <button type="button" id="tab-register" onclick="switchAuthTab('register')" class="py-2.5 rounded-lg text-slate-500 hover:text-slate-900 transition">Inscription</button>
                </div>

                <!-- Formulaire Connexion -->
                <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Numéro de téléphone</label>
                        <input type="text" id="login-phone" placeholder="ex: 70000000" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Mot de Passe</label>
                        <input type="password" id="login-password" placeholder="••••••••" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl transition text-sm">Se connecter</button>
                </form>

                <!-- Formulaire Inscription -->
                <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nom</label>
                            <input type="text" id="reg-nom" required class="w-full px-3 py-2 rounded-xl border border-slate-200 outline-none text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Prénom</label>
                            <input type="text" id="reg-prenom" required class="w-full px-3 py-2 rounded-xl border border-slate-200 outline-none text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Téléphone</label>
                        <input type="text" id="reg-phone" placeholder="ex: 70000000" required class="w-full px-3 py-2 rounded-xl border border-slate-200 outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Mot de Passe</label>
                        <input type="password" id="reg-password" minlength="6" placeholder="Au moins 6 caractères" required class="w-full px-3 py-2 rounded-xl border border-slate-200 outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Rôle</label>
                        <select id="reg-role" onchange="toggleCodeProf()" class="w-full px-3 py-2 rounded-xl border border-slate-200 outline-none text-sm bg-white">
                            <option value="PARENT">Parent d'élève</option>
                            <option value="PROFESSEUR">Enseignant / Professeur</option>
                        </select>
                    </div>
                    <div id="bloc-code-prof" class="hidden">
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Code Professeur</label>
                        <input type="text" id="reg-code-prof" placeholder="Fourni par la direction" class="w-full px-3 py-2 rounded-xl border border-slate-200 outline-none text-sm">
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl transition text-sm">Créer mon compte</button>
                </form>

                <div id="auth-error" class="mt-4 p-3 bg-rose-50 border border-rose-100 rounded-xl text-xs font-medium text-rose-600 text-center hidden"></div>
            </div>
        </section>

        <!-- ESPACE DIRECTION / ADMIN -->
        <section id="dashboard-admin" class="space-y-8 hidden">
            <div class="bg-slate-900 rounded-2xl p-6 text-white shadow-xl flex justify-between items-center">
                <div>
                    <span class="text-xs uppercase tracking-widest text-indigo-300 font-semibold">Administration</span>
                    <h2 class="text-2xl font-bold mt-1">Espace Direction</h2>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                <h3 class="font-bold text-slate-900 text-base mb-4">Inscrire un nouvel élève</h3>
                <form id="form-ajout-eleve" onsubmit="handleAjoutEleve(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="eleve-nom" placeholder="Nom de l'élève" required class="px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm">
                    <input type="text" id="eleve-prenom" placeholder="Prénom de l'élève" required class="px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm">
                    <input type="text" id="eleve-matricule" placeholder="Matricule (ex: MAT-2026)" required class="px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm">
                    <input type="date" id="eleve-date-naissance" required class="px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm">
                    <input type="text" id="eleve-code-parent" placeholder="Code secret parent (ex: 4821)" required class="px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm">
                    <select id="eleve-classe-id" required class="px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm">
                        <option value="">Chargement des classes...</option>
                    </select>
                    <button type="submit" class="md:col-span-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl transition text-sm">Enregistrer l'élève</button>
                </form>
            </div>

            <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                <h3 class="font-bold text-slate-900 text-base mb-4">Affecter un professeur à une classe / matière</h3>
                <form id="form-affectation" onsubmit="handleAffectation(event)" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <input type="text" id="affect-tel-prof" placeholder="Téléphone du professeur" required class="px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm">
                    <select id="affect-classe-id" required class="px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm">
                        <option value="">Classe...</option>
                    </select>
                    <select id="affect-matiere-id" required class="px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm">
                        <option value="">Matière...</option>
                    </select>
                    <button type="submit" class="bg-slate-900 hover:bg-slate-800 text-white font-semibold py-2.5 rounded-xl transition text-sm">Affecter</button>
                </form>
            </div>
        </section>

        <!-- ESPACE ENSEIGNANT -->
        <section id="dashboard-prof" class="max-w-4xl mx-auto space-y-6 hidden">
            <div class="bg-white rounded-2xl p-8 border border-slate-200 shadow-sm">
                <h2 class="text-2xl font-bold text-slate-900 mb-6">Saisie des Évaluations</h2>
                <div class="space-y-5">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">1. Classe <span class="text-slate-400 normal-case font-normal">(classes qui vous ont été affectées)</span></label>
                        <select id="note-classe-id" onchange="onClasseProfChange(this.value)" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 outline-none text-sm bg-white">
                            <option value="">Choisir une classe...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">2. Matière</label>
                        <select id="note-matiere-id" onchange="rafraichirGrilleNotes()" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 outline-none text-sm bg-white">
                            <option value="">Choisir d'abord une classe</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-2">3. Type d'évaluation</label>
                        <div class="grid grid-cols-3 gap-3">
                            <label class="type-devoir-option cursor-pointer text-center py-3 rounded-xl border-2 border-slate-200 text-sm font-semibold text-slate-600 hover:border-indigo-300 transition">
                                <input type="radio" name="type_devoir" value="Devoir 1" class="hidden" checked onchange="updateTypeDevoirStyle(); rafraichirGrilleNotes()">
                                Devoir 1
                            </label>
                            <label class="type-devoir-option cursor-pointer text-center py-3 rounded-xl border-2 border-slate-200 text-sm font-semibold text-slate-600 hover:border-indigo-300 transition">
                                <input type="radio" name="type_devoir" value="Devoir 2" class="hidden" onchange="updateTypeDevoirStyle(); rafraichirGrilleNotes()">
                                Devoir 2
                            </label>
                            <label class="type-devoir-option cursor-pointer text-center py-3 rounded-xl border-2 border-slate-200 text-sm font-semibold text-slate-600 hover:border-indigo-300 transition">
                                <input type="radio" name="type_devoir" value="Composition" class="hidden" onchange="updateTypeDevoirStyle(); rafraichirGrilleNotes()">
                                Composition
                            </label>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Coefficient (appliqué à toute la saisie)</label>
                            <input type="number" min="1" max="10" id="note-coefficient" value="1" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 outline-none text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Trimestre</label>
                            <select id="note-trimestre" onchange="rafraichirGrilleNotes()" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 outline-none text-sm bg-white">
                                <option value="1">Trimestre 1</option>
                                <option value="2">Trimestre 2</option>
                                <option value="3">Trimestre 3</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Grille de saisie : apparaît une fois classe + matière choisies -->
            <div id="grille-notes-wrapper" class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm hidden">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-slate-900 text-base">Liste de la classe</h3>
                    <span id="grille-notes-info" class="text-xs text-slate-400"></span>
                </div>
                <div id="grille-notes-body" class="divide-y divide-slate-100">
                    <!-- lignes élèves injectées ici -->
                </div>
                <button type="button" onclick="enregistrerGrilleNotes()" class="mt-6 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition text-sm">Enregistrer toutes les notes</button>
                <div id="grille-notes-msg" class="mt-3 text-xs text-center hidden"></div>
            </div>
        </section>

        <!-- ESPACE PARENT -->
        <section id="dashboard-parent" class="space-y-8 hidden">
            <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                <h3 class="font-bold text-slate-900 text-sm uppercase mb-3">Rattacher un enfant</h3>
                <form id="form-rattacher" onsubmit="handleRattacherEnfant(event)" class="flex flex-col sm:flex-row gap-3">
                    <input type="text" id="rat-matricule" placeholder="Matricule (ex: MAT-2026)" required class="flex-1 px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm">
                    <input type="password" id="rat-code" placeholder="Code secret parent" required class="flex-1 px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm">
                    <button type="submit" class="bg-slate-900 hover:bg-slate-800 text-white font-semibold px-6 py-2.5 rounded-xl transition text-sm">Lier l'enfant</button>
                </form>
            </div>
            <div id="parent-enfants-container" class="grid grid-cols-1 gap-6"></div>
        </section>

    </main>

    <script>
        // ⚠️ Configuration Supabase
        const SUPABASE_URL = "https://krikondxbeexmjruybeo.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtyaWtvbmR4YmVleG1qcnV5YmVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MzUyNzcsImV4cCI6MjEwNDExMTI3N30.QvFXypjUO_NFv4B-zFCzEsecRABGL8c_kVokzxuzHv8";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const DOMAINE_TECHNIQUE = "@edusmart.com";
        let currentUser = null;

        function telephoneVersEmail(tel) {
            return tel.replace(/\s+/g, '') + DOMAINE_TECHNIQUE;
        }

        function toggleCodeProf() {
            const isProf = document.getElementById('reg-role').value === 'PROFESSEUR';
            document.getElementById('bloc-code-prof').classList.toggle('hidden', !isProf);
            document.getElementById('reg-code-prof').required = isProf;
        }

        function switchAuthTab(tab) {
            document.getElementById('form-login').classList.toggle('hidden', tab !== 'login');
            document.getElementById('form-register').classList.toggle('hidden', tab !== 'register');
            document.getElementById('tab-login').className = tab === 'login' ? "py-2.5 rounded-lg bg-white shadow-sm text-slate-900 transition" : "py-2.5 rounded-lg text-slate-500 hover:text-slate-900 transition";
            document.getElementById('tab-register').className = tab === 'register' ? "py-2.5 rounded-lg bg-white shadow-sm text-slate-900 transition" : "py-2.5 rounded-lg text-slate-500 hover:text-slate-900 transition";
        }

        function showAuthError(msg) {
            const errElem = document.getElementById('auth-error');
            errElem.textContent = msg;
            errElem.classList.toggle('hidden', !msg);
        }

        // --- SESSION : reste connecté après rechargement de page ---
        async function initSession() {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();

                if (session) {
                    const { data: userProfile, error: profileError } = await supabaseClient.from('utilisateurs').select('*').eq('id', session.user.id).single();
                    if (userProfile && !profileError) {
                        currentUser = userProfile;
                        setupDashboard();
                        document.getElementById('loading-screen').classList.add('hidden');
                        return;
                    } else {
                        // Session invalide ou profil introuvable -> on force une reconnexion propre
                        await supabaseClient.auth.signOut();
                        currentUser = null;
                    }
                }
            } catch (err) {
                showAuthError("Connexion à Supabase impossible. Vérifie SUPABASE_URL et SUPABASE_ANON_KEY dans le code.");
                console.error(err);
            } finally {
                document.getElementById('loading-screen').classList.add('hidden');
                if (!currentUser) {
                    document.getElementById('auth-section').classList.remove('hidden');
                }
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            showAuthError("");
            const phone = document.getElementById('login-phone').value.trim();
            const password = document.getElementById('login-password').value;

            const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
                email: telephoneVersEmail(phone),
                password: password
            });

            if (authError) {
                showAuthError("Numéro ou mot de passe incorrect.");
                return;
            }

            const { data: userProfile, error: profileError } = await supabaseClient
                .from('utilisateurs').select('*').eq('id', authData.user.id).single();

            if (profileError || !userProfile) {
                showAuthError("Impossible de charger votre profil.");
                return;
            }

            currentUser = userProfile;
            setupDashboard();
        }

        async function handleRegister(e) {
            e.preventDefault();
            showAuthError("");

            const nom = document.getElementById('reg-nom').value.trim();
            const prenom = document.getElementById('reg-prenom').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const password = document.getElementById('reg-password').value;
            const role = document.getElementById('reg-role').value;
            const codeProf = document.getElementById('reg-code-prof').value.trim();

            if (role === 'PROFESSEUR') {
                const { data: codeValide } = await supabaseClient.rpc('verifier_code_prof', { input_code: codeProf });
                if (!codeValide) {
                    showAuthError("Code professeur invalide.");
                    return;
                }
            }

            const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                email: telephoneVersEmail(phone),
                password: password
            });

            if (authError) {
                showAuthError("Erreur d'inscription : " + authError.message);
                return;
            }

            if (authData.user) {
                const { error: profileError } = await supabaseClient
                    .from('utilisateurs')
                    .insert([{ id: authData.user.id, nom, prenom, telephone: phone, role }]);

                if (profileError) {
                    showAuthError("Erreur création profil : " + profileError.message);
                    return;
                }

                alert("Compte créé avec succès ! Vous pouvez vous connecter.");
                switchAuthTab('login');
                document.getElementById('form-register').reset();
            }
        }

        // Masque tous les espaces avant d'afficher celui du rôle courant (corrige l'affichage
        // qui pouvait rester bloqué sur "Espace Direction" d'une session précédente).
        function hideAllDashboards() {
            document.getElementById('dashboard-admin').classList.add('hidden');
            document.getElementById('dashboard-prof').classList.add('hidden');
            document.getElementById('dashboard-parent').classList.add('hidden');
            document.getElementById('auth-section').classList.add('hidden');
        }

        function setupDashboard() {
            hideAllDashboards();
            document.getElementById('nav-user-info').classList.remove('hidden');
            document.getElementById('user-display-name').textContent = `${currentUser.prenom} ${currentUser.nom}`;
            document.getElementById('user-display-role').textContent = currentUser.role;

            if (currentUser.role === 'ADMIN') {
                document.getElementById('dashboard-admin').classList.remove('hidden');
                chargerClassesInSelect('eleve-classe-id');
                chargerClassesInSelect('affect-classe-id');
                chargerMatieresInSelect('affect-matiere-id');
            } else if (currentUser.role === 'PROFESSEUR') {
                document.getElementById('dashboard-prof').classList.remove('hidden');
                chargerClassesProf();
                updateTypeDevoirStyle();
            } else if (currentUser.role === 'PARENT') {
                document.getElementById('dashboard-parent').classList.remove('hidden');
                loadParentDashboard();
            } else {
                // Rôle inconnu : on évite d'afficher un espace par défaut, on repart sur la connexion
                showAuthError("Rôle de compte inconnu, merci de contacter la direction.");
                document.getElementById('auth-section').classList.remove('hidden');
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            location.reload();
        }

        async function chargerClassesInSelect(selectId) {
            const { data: classes } = await supabaseClient.from('classes').select('id, nom_classe');
            const select = document.getElementById(selectId);
            select.innerHTML = '<option value="">Choisir une classe...</option>';
            if (classes) classes.forEach(c => { select.innerHTML += `<option value="${c.id}">${c.nom_classe}</option>`; });
        }

        async function chargerMatieresInSelect(selectId) {
            const { data: matieres } = await supabaseClient.from('matieres').select('id, nom_matiere');
            const select = document.getElementById(selectId);
            select.innerHTML = '<option value="">Choisir une matière...</option>';
            if (matieres) matieres.forEach(m => { select.innerHTML += `<option value="${m.id}">${m.nom_matiere}</option>`; });
        }

        let profAffectations = [];

        async function chargerClassesProf() {
            const { data, error } = await supabaseClient
                .from('affectations_profs')
                .select('classe_id, matiere_id, classes(nom_classe), matieres(nom_matiere)')
                .eq('prof_id', currentUser.id);

            const classeSelect = document.getElementById('note-classe-id');

            if (error || !data || data.length === 0) {
                classeSelect.innerHTML = '<option value="">Aucune classe ne vous a été affectée</option>';
                profAffectations = [];
                return;
            }

            profAffectations = data.map(a => ({
                classe_id: a.classe_id,
                nom_classe: a.classes ? a.classes.nom_classe : 'Classe',
                matiere_id: a.matiere_id,
                nom_matiere: a.matieres ? a.matieres.nom_matiere : 'Matière'
            }));

            const classesUniques = [...new Map(profAffectations.map(a => [a.classe_id, a.nom_classe])).entries()];
            classeSelect.innerHTML = '<option value="">Choisir une classe...</option>';
            classesUniques.forEach(([id, nom]) => {
                classeSelect.innerHTML += `<option value="${id}">${nom}</option>`;
            });
        }

        function onClasseProfChange(classeId) {
            chargerMatieresProfPourClasse(classeId);
            masquerGrilleNotes();
        }

        function chargerMatieresProfPourClasse(classeId) {
            const matiereSelect = document.getElementById('note-matiere-id');
            if (!classeId) {
                matiereSelect.innerHTML = '<option value="">Choisir d\'abord une classe</option>';
                return;
            }
            const matieres = profAffectations.filter(a => String(a.classe_id) === String(classeId));
            matiereSelect.innerHTML = '<option value="">Choisir une matière...</option>';
            matieres.forEach(m => {
                matiereSelect.innerHTML += `<option value="${m.matiere_id}">${m.nom_matiere}</option>`;
            });
        }

        function updateTypeDevoirStyle() {
            document.querySelectorAll('.type-devoir-option').forEach(label => {
                const input = label.querySelector('input');
                if (input && input.checked) {
                    label.classList.add('border-indigo-600', 'bg-indigo-50', 'text-indigo-700');
                    label.classList.remove('border-slate-200', 'text-slate-600');
                } else {
                    label.classList.remove('border-indigo-600', 'bg-indigo-50', 'text-indigo-700');
                    label.classList.add('border-slate-200', 'text-slate-600');
                }
            });
        }

        function masquerGrilleNotes() {
            document.getElementById('grille-notes-wrapper').classList.add('hidden');
            document.getElementById('grille-notes-body').innerHTML = '';
        }

        // Appelé quand matière / type d'évaluation / trimestre changent
        function rafraichirGrilleNotes() {
            const classeId = document.getElementById('note-classe-id').value;
            const matiereId = document.getElementById('note-matiere-id').value;
            if (!classeId || !matiereId) {
                masquerGrilleNotes();
                return;
            }
            chargerGrilleNotes(classeId, matiereId);
        }

        async function chargerGrilleNotes(classeId, matiereId) {
            const typeDevoir = document.querySelector('input[name="type_devoir"]:checked').value;
            const trimestre = parseInt(document.getElementById('note-trimestre').value);

            const { data: eleves, error: elevesError } = await supabaseClient
                .from('eleves')
                .select('id, nom, prenom, matricule')
                .eq('classe_id', classeId)
                .order('nom', { ascending: true });

            const body = document.getElementById('grille-notes-body');
            const wrapper = document.getElementById('grille-notes-wrapper');
            const info = document.getElementById('grille-notes-info');

            if (elevesError || !eleves || eleves.length === 0) {
                body.innerHTML = `<p class="py-6 text-center text-sm text-slate-400">Aucun élève dans cette classe.</p>`;
                wrapper.classList.remove('hidden');
                info.textContent = '';
                return;
            }

            // Récupère les notes déjà saisies par ce prof pour cette matière/type/trimestre
            const eleveIds = eleves.map(e => e.id);
            const { data: notesExistantes } = await supabaseClient
                .from('notes')
                .select('id, eleve_id, note')
                .eq('matiere_id', matiereId)
                .eq('prof_id', currentUser.id)
                .eq('type_devoir', typeDevoir)
                .eq('trimestre', trimestre)
                .in('eleve_id', eleveIds);

            const noteParEleve = {};
            if (notesExistantes) {
                notesExistantes.forEach(n => { noteParEleve[n.eleve_id] = n.note; });
            }

            info.textContent = `${eleves.length} élève(s) — ${typeDevoir} — Trimestre ${trimestre}`;

            body.innerHTML = eleves.map(e => {
                const valeurExistante = noteParEleve.hasOwnProperty(e.id) ? noteParEleve[e.id] : '';
                return `
                <div class="flex items-center gap-4 py-3" data-eleve-id="${e.id}">
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-semibold text-slate-800 truncate">${e.nom} ${e.prenom}</p>
                        <p class="text-xs text-slate-400">${e.matricule}</p>
                    </div>
                    <input type="number" step="0.25" min="0" max="20" placeholder="/20"
                        class="grille-note-input w-24 px-3 py-2 rounded-xl border border-slate-200 text-sm font-bold text-indigo-600 text-center focus:ring-2 focus:ring-indigo-500 outline-none"
                        value="${valeurExistante}">
                </div>`;
            }).join('');

            wrapper.classList.remove('hidden');
        }

        function showGrilleMsg(msg, isError) {
            const el = document.getElementById('grille-notes-msg');
            el.textContent = msg;
            el.classList.remove('hidden', 'text-emerald-600', 'text-rose-600');
            el.classList.add(isError ? 'text-rose-600' : 'text-emerald-600');
        }

        async function enregistrerGrilleNotes() {
            const matiereId = parseInt(document.getElementById('note-matiere-id').value);
            const typeDevoir = document.querySelector('input[name="type_devoir"]:checked').value;
            const trimestre = parseInt(document.getElementById('note-trimestre').value);
            const coefficient = parseInt(document.getElementById('note-coefficient').value);

            const lignes = document.querySelectorAll('#grille-notes-body [data-eleve-id]');
            const notesAEnregistrer = [];

            lignes.forEach(ligne => {
                const eleveId = ligne.getAttribute('data-eleve-id');
                const input = ligne.querySelector('.grille-note-input');
                const valeur = input.value.trim();
                if (valeur !== '') {
                    notesAEnregistrer.push({
                        eleve_id: eleveId,
                        matiere_id: matiereId,
                        prof_id: currentUser.id,
                        type_devoir: typeDevoir,
                        trimestre: trimestre,
                        note: parseFloat(valeur),
                        coefficient: coefficient
                    });
                }
            });

            if (notesAEnregistrer.length === 0) {
                showGrilleMsg("Aucune note saisie.", true);
                return;
            }

            // Upsert : insère les nouvelles notes, met à jour celles qui existent déjà
            // (nécessite la contrainte unique sur eleve_id, matiere_id, prof_id, type_devoir, trimestre)
            const { error } = await supabaseClient
                .from('notes')
                .upsert(notesAEnregistrer, { onConflict: 'eleve_id,matiere_id,prof_id,type_devoir,trimestre' });

            if (error) {
                showGrilleMsg("Erreur lors de l'enregistrement : " + error.message, true);
            } else {
                showGrilleMsg(`${notesAEnregistrer.length} note(s) enregistrée(s) avec succès !`, false);
            }
        }

        async function handleAjoutEleve(e) {
            e.preventDefault();
            const nom = document.getElementById('eleve-nom').value.trim();
            const prenom = document.getElementById('eleve-prenom').value.trim();
            const matricule = document.getElementById('eleve-matricule').value.trim();
            const date_naissance = document.getElementById('eleve-date-naissance').value;
            const code_secret_parent = document.getElementById('eleve-code-parent').value.trim();
            const classe_id = document.getElementById('eleve-classe-id').value;

            const { error } = await supabaseClient.from('eleves').insert([{ nom, prenom, matricule, date_naissance, code_secret_parent, classe_id }]);

            if (error) {
                alert("Erreur lors de l'ajout : " + error.message);
            } else {
                alert("Élève inscrit !");
                document.getElementById('form-ajout-eleve').reset();
            }
        }

        async function handleAffectation(e) {
            e.preventDefault();
            const telProf = document.getElementById('affect-tel-prof').value.trim();
            const classe_id = document.getElementById('affect-classe-id').value;
            const matiere_id = document.getElementById('affect-matiere-id').value;

            const { data: prof, error: profError } = await supabaseClient
                .from('utilisateurs').select('id, role').eq('telephone', telProf).single();

            if (profError || !prof || prof.role !== 'PROFESSEUR') {
                alert("Aucun professeur trouvé avec ce numéro.");
                return;
            }

            const { error } = await supabaseClient.from('affectations_profs').insert([{ prof_id: prof.id, classe_id, matiere_id }]);
            if (error) {
                alert("Erreur : " + error.message);
            } else {
                alert("Affectation créée !");
                document.getElementById('form-affectation').reset();
            }
        }

        async function handleRattacherEnfant(e) {
            e.preventDefault();
            const matricule = document.getElementById('rat-matricule').value.trim();
            const codeSecret = document.getElementById('rat-code').value.trim();

            const { data, error } = await supabaseClient.rpc('rattacher_eleve_parent', {
                p_parent_id: currentUser.id,
                p_matricule: matricule,
                p_code_secret: codeSecret
            });

            if (error || !data) {
                alert("Rattachement échoué. Code ou matricule invalide.");
            } else {
                alert("Enfant rattaché !");
                document.getElementById('form-rattacher').reset();
                loadParentDashboard();
            }
        }

        async function loadParentDashboard() {
            const container = document.getElementById('parent-enfants-container');
            container.innerHTML = "";

            const { data: enfants } = await supabaseClient
                .from('eleves')
                .select('*, classes(nom_classe), notes(*, matieres(nom_matiere))')
                .eq('parent_id', currentUser.id);

            if (!enfants || enfants.length === 0) {
                container.innerHTML = `<div class="bg-white p-8 rounded-2xl border border-slate-200 text-center text-slate-400 text-sm">Aucun élève rattaché.</div>`;
                return;
            }

            enfants.forEach(e => {
                let notesHTML = "";
                if (e.notes && e.notes.length > 0) {
                    e.notes.forEach(n => {
                        notesHTML += `<tr class="border-b border-slate-100">
                            <td class="py-3 font-semibold">${n.matieres ? n.matieres.nom_matiere : 'Matière'}</td>
                            <td class="py-3 text-xs text-slate-500">${n.type_devoir || '-'}</td>
                            <td class="py-3 text-xs text-slate-500">${n.appreciation || '-'}</td>
                            <td class="py-3 text-right font-bold text-indigo-600">${n.note}/20 (Coeff ${n.coefficient || 1})</td>
                        </tr>`;
                    });
                } else {
                    notesHTML = `<tr><td colspan="4" class="py-4 text-center text-xs text-slate-400 italic">Aucune note.</td></tr>`;
                }

                container.innerHTML += `
                    <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-4">
                        <div class="border-b border-slate-100 pb-3">
                            <h4 class="text-xl font-bold text-slate-900">${e.prenom} ${e.nom}</h4>
                            <p class="text-xs text-slate-400">Matricule: ${e.matricule} • Classe: ${e.classes ? e.classes.nom_classe : 'Non assignée'}</p>
                        </div>
                        <table class="w-full text-left text-sm">
                            <thead><tr class="text-xs text-slate-400 border-b border-slate-100">
                                <th class="pb-2">Matière</th><th class="pb-2">Type</th><th class="pb-2">Appréciation</th><th class="pb-2 text-right">Note</th>
                            </tr></thead>
                            <tbody>${notesHTML}</tbody>
                        </table>
                    </div>`;
            });
        }

        initSession();
    </script>
</body>
</html>
